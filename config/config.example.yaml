server:
  port: 8080
  mode: debug

database:
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:3306}
  username: ${DB_USERNAME:root}
  password: ${DB_PASSWORD:your_password}
  database: ${DB_DATABASE:steellink}
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  db: ${REDIS_DB:0}
  pool_size: 10

jwt:
  secret: ${JWT_SECRET:your-jwt-secret-key-change-in-production}
  expire: 86400
  refresh_expire: 604800
  issuer: steellink

log:
  level: ${LOG_LEVEL:debug}
  format: json
  output: stdout
  max_size: 100
  max_backups: 5
  max_age: 30
  compress: true

kafka:
  brokers:
    - ${KAFKA_BROKER:localhost:9092}
  group_id: steellink-backend

storage:
  provider: ${STORAGE_PROVIDER:tencent_cos}
  region: ${COS_REGION:ap-beijing}
  secret_id: ${COS_SECRET_ID:}
  secret_key: ${COS_SECRET_KEY:}
  public_bucket: ${COS_PUBLIC_BUCKET:}
  private_bucket: ${COS_PRIVATE_BUCKET:}
  admin_bucket: ${COS_ADMIN_BUCKET:}
  public_base_url: ${COS_PUBLIC_BASE_URL:}
  private_base_url: ${COS_PRIVATE_BASE_URL:}
  admin_base_url: ${COS_ADMIN_BASE_URL:}
  max_file_size_mb: ${STORAGE_MAX_FILE_SIZE_MB:20}

ai_procurement:
  model_parsing_enabled: ${AI_PROCUREMENT_MODEL_PARSING_ENABLED:false}
  provider: ${AI_PROCUREMENT_PROVIDER:minimax}
  base_url: ${AI_PROCUREMENT_BASE_URL:https://api.minimax.io/v1/chat/completions}
  api_key_env: ${AI_PROCUREMENT_API_KEY_ENV:MINIMAX_API_KEY}
  model: ${AI_PROCUREMENT_MODEL:MiniMax-M2.7}
  temperature: ${AI_PROCUREMENT_TEMPERATURE:0.2}
  top_p: ${AI_PROCUREMENT_TOP_P:0.9}
  max_tokens: ${AI_PROCUREMENT_MAX_TOKENS:1200}
  timeout_sec: ${AI_PROCUREMENT_TIMEOUT_SEC:20}
  confidence_threshold: ${AI_PROCUREMENT_CONFIDENCE_THRESHOLD:0.78}
  vector_search:
    enabled: ${AI_PROCUREMENT_VECTOR_SEARCH_ENABLED:false}
    provider: ${AI_PROCUREMENT_VECTOR_PROVIDER:milvus}
    endpoint: ${MILVUS_ENDPOINT:localhost:19530}
    database: ${MILVUS_DATABASE:steellink_ai}
    username: ${MILVUS_USERNAME:}
    password_env: ${MILVUS_PASSWORD_ENV:MILVUS_PASSWORD}
    product_collection: ${AI_PRODUCT_VECTOR_COLLECTION:ai_product_embeddings}
    supplier_collection: ${AI_SUPPLIER_VECTOR_COLLECTION:ai_supplier_embeddings}
    finance_product_collection: ${AI_FINANCE_PRODUCT_VECTOR_COLLECTION:ai_finance_product_embeddings}
    embedding_provider: ${AI_EMBEDDING_PROVIDER:minimax}
    embedding_base_url: ${AI_EMBEDDING_BASE_URL:https://api.minimax.io/v1/embeddings}
    embedding_api_key_env: ${AI_EMBEDDING_API_KEY_ENV:MINIMAX_API_KEY}
    embedding_model: ${AI_EMBEDDING_MODEL:embo-01}
    dimension: ${AI_EMBEDDING_DIMENSION:1536}
    top_k: ${AI_VECTOR_TOP_K:10}
    min_score: ${AI_VECTOR_MIN_SCORE:0.65}
    hybrid_keyword_weight: ${AI_HYBRID_KEYWORD_WEIGHT:0.35}
    hybrid_vector_weight: ${AI_HYBRID_VECTOR_WEIGHT:0.65}
  runtime_config:
    enabled: ${AI_PROCUREMENT_RUNTIME_CONFIG_ENABLED:false}
    endpoint: ${AI_PROCUREMENT_RUNTIME_CONFIG_ENDPOINT:}
    token_env: ${AI_PROCUREMENT_RUNTIME_CONFIG_TOKEN_ENV:AI_PROCUREMENT_CONFIG_SYNC_TOKEN}
    cache_ttl_sec: ${AI_PROCUREMENT_RUNTIME_CONFIG_CACHE_TTL_SEC:30}
