# SteelLink Backend Configuration
#
# 加载顺序：config.yaml → .env 覆盖 → 系统环境变量覆盖
# 敏感信息（密码、密钥、服务器IP）请写在 .env 文件中

server:
  port: 8080
  mode: debug  # debug, release, test

database:
  host: 172.16.0.6          # 被 DATABASE_HOST 覆盖
  port: 3306               # 被 DATABASE_PORT 覆盖
  username: root           # 被 DATABASE_USERNAME 覆盖
  password: "Steellink2026"             # 被 DATABASE_PASSWORD 覆盖
  database: steellink      # 被 DATABASE_NAME 覆盖
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600  # seconds

redis:
  host: 172.16.0.6          # 被 REDIS_HOST 覆盖
  port: 6379               # 被 REDIS_PORT 覆盖
  password: "Steellink2026"             # 被 REDIS_PASSWORD 覆盖
  db: 0                    # 被 REDIS_DB 覆盖
  pool_size: 10

jwt:
  secret: change-me        # 被 JWT_SECRET 覆盖
  expire: 86400            # seconds (24 hours)
  refresh_expire: 604800   # seconds (7 days)
  issuer: steellink

log:
  level: debug             # 被 LOG_LEVEL 覆盖
  format: json             # 被 LOG_FORMAT 覆盖
  output: stdout           # 被 LOG_OUTPUT 覆盖
  max_size: 100
  max_backups: 5
  max_age: 30
  compress: true

kafka:
  brokers:                 # 被 KAFKA_BROKERS (逗号分隔) 覆盖
    - localhost:9092
  group_id: steellink-backend

storage:
  provider: tencent_cos
  region: ap-beijing
  secret_id: ""            # 被 COS_SECRET_ID 覆盖
  secret_key: ""           # 被 COS_SECRET_KEY 覆盖
  public_bucket: steellink-public-1321917249
  private_bucket: steellink-user-pri-1321917249
  admin_bucket: steellink-admin-1321917249
  public_base_url: https://steellink-public-1321917249.cos.ap-beijing.myqcloud.com
  private_base_url: https://steellink-user-pri-1321917249.cos.ap-beijing.myqcloud.com
  admin_base_url: https://steellink-admin-1321917249.cos.ap-beijing.myqcloud.com
  max_file_size_mb: 20

ai_procurement:
  model_parsing_enabled: false
  provider: minimax
  base_url: https://api.minimax.io/v1/chat/completions
  api_key_env: MINIMAX_API_KEY
  model: MiniMax-M2.7
  temperature: 0.2
  top_p: 0.9
  max_tokens: 1200
  timeout_sec: 20
  confidence_threshold: 0.78
  vector_search:
    enabled: false
    provider: milvus
    endpoint: localhost:19530
    database: steellink_ai
    username: ""
    password_env: MILVUS_PASSWORD
    product_collection: ai_product_embeddings
    supplier_collection: ai_supplier_embeddings
    finance_product_collection: ai_finance_product_embeddings
    embedding_provider: minimax
    embedding_base_url: https://api.minimax.io/v1/embeddings
    embedding_api_key_env: MINIMAX_API_KEY
    embedding_model: embo-01
    dimension: 1536
    top_k: 10
    min_score: 0.65
    hybrid_keyword_weight: 0.35
    hybrid_vector_weight: 0.65
  runtime_config:
    enabled: false
    endpoint: ""
    token_env: AI_PROCUREMENT_CONFIG_SYNC_TOKEN
    cache_ttl_sec: 30
